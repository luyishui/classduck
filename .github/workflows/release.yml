name: Build & Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Restore signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/classduck-release-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=classduck-release-keystore.jks
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build universal APK
        run: flutter build apk --release

      - name: Build split-per-abi APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/classduck-android-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/classduck-android-arm64.apk

      - name: Update release.json and push
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          python - "$VERSION" <<'PY'
          import json, sys
          version = sys.argv[1]
          payload = {
            "latestVersion": version,
            "currentVersion": version,
            "hasNewVersion": False,
            "updateUrl": "https://luyishui.github.io/classduck/",
            "releaseNotes": ["请到下载页获取最新版本并进行更新"],
          }
          with open("docs/release.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
          PY
          git config user.name "classduck-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/release.json
          git commit -m "chore: update release.json to $VERSION" || echo "no change"
          git push

      - name: Purge jsDelivr cache
        run: curl -i "https://purge.jsdelivr.net/gh/luyishui/classduck@main/docs/release.json"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: false