<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>上课鸭 ClassDuck - 下载中心</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2329;
      --muted: #8a919f;
      --accent: #ffd666;
      --accent-text: #4a3414;
      --border: #eceef3;
      --disabled-bg: #eceef3;
      --disabled-text: #b3b8c2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17191e;
        --card: #21242b;
        --text: #eceef1;
        --muted: #9aa1ad;
        --border: #30343d;
        --disabled-bg: #2a2e36;
        --disabled-text: #7c828d;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 48px 20px 32px;
    }
    .wrap { max-width: 420px; margin: 0 auto; }
    #app { text-align: center; }
    header h1 { font-size: 28px; letter-spacing: 1px; }
    header .sub { color: var(--muted); font-size: 14px; margin-top: 6px; }
    header .version {
      display: inline-block;
      margin-top: 14px;
      padding: 4px 14px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 13px;
      font-weight: 600;
    }
    .cards { margin-top: 32px; display: grid; gap: 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      text-align: left;
    }
    .card h2 { font-size: 17px; display: flex; align-items: center; gap: 8px; }
    .card .desc { color: var(--muted); font-size: 13px; margin: 8px 0 14px; }
    .btn {
      display: block;
      width: 100%;
      padding: 12px 0;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      background: var(--accent);
      color: var(--accent-text);
      margin-top: 10px;
    }
    .btn.secondary { background: var(--disabled-bg); color: var(--muted); }
    .btn.disabled { background: var(--disabled-bg); color: var(--disabled-text); cursor: not-allowed; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 10px; }
    footer { color: var(--muted); font-size: 12px; margin-top: 32px; }
  </style>
</head>
<body>
  <div id="app">
    <div class="wrap">
      <header>
        <h1>上课鸭 ClassDuck</h1>
        <p class="sub">简洁好用的校园课表助手</p>
        <span class="version">当前版本 {{ version }}</span>
      </header>

      <div class="cards">
        <div class="card">
          <h2>📱 Android</h2>
          <p class="desc">支持 Android 7.0 及以上设备</p>
          <a class="btn" :href="androidUrl">下载 APK（通用版）</a>
          <a class="btn secondary" :href="androidMirrorUrl">镜像下载</a>
          <p class="hint">需要更高性能？可到 Release 页下载 arm64 高性能版。</p>
        </div>

        <div class="card">
          <h2>🍎 iOS</h2>
          <p class="desc">App Store 版本准备中</p>
          <button class="btn disabled" disabled>敬请期待</button>
        </div>

        <div class="card">
          <h2>🦅 鸿蒙</h2>
          <p class="desc">HarmonyOS 版本准备中</p>
          <button class="btn disabled" disabled>敬请期待</button>
        </div>
      </div>

      <footer>更新 / 公告自动同步自 GitHub Releases</footer>
    </div>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script>
    const { createApp } = Vue;
    createApp({
      data() {
        return {
          version: '1.0.0',
          androidUrl: 'https://github.com/luyishui/classduck/releases/latest/download/classduck-android-universal.apk',
          androidMirrorUrl: 'https://gh-proxy.com/https://github.com/luyishui/classduck/releases/latest/download/classduck-android-universal.apk',
        };
      },
      mounted() {
        // 发版后 release.json 由 CI 更新，页面版本号自动同步。
        fetch('./release.json')
          .then((res) => (res.ok ? res.json() : null))
          .then((data) => {
            if (data && data.latestVersion) this.version = data.latestVersion;
          })
          .catch(() => {});
      },
    }).mount('#app');
  </script>
</body>
</html>
